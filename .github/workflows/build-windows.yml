name: Build Edit Master 1.0 Beta Oficial

on:
  push:
    branches:
      - main
      - v1.0-development
      - v1.0-rebuild
      - v1.0-beta-integrated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Edit Master for Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Prepare bundled media tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourceRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri/resources"
          $ffmpegDir = Join-Path $resourceRoot "ffmpeg"
          $whisperDir = Join-Path $resourceRoot "whisper"
          New-Item -ItemType Directory -Force -Path $ffmpegDir, $whisperDir | Out-Null

          $ffmpegZip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Remove-Item $ffmpegZip -Force -ErrorAction SilentlyContinue
              Write-Host "Downloading FFmpeg (attempt $attempt/5)..."
              Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip -TimeoutSec 180
              if (-not (Test-Path $ffmpegZip) -or (Get-Item $ffmpegZip).Length -lt 1000000) { throw "FFmpeg download is missing or unexpectedly small." }
              $stream = [System.IO.File]::OpenRead($ffmpegZip)
              try {
                $signature = New-Object byte[] 4
                [void]$stream.Read($signature, 0, 4)
              } finally { $stream.Dispose() }
              if ($signature[0] -ne 0x50 -or $signature[1] -ne 0x4B) { throw "Downloaded response is not a ZIP archive (possible GitHub error page)." }
              $downloaded = $true
              break
            } catch {
              Write-Warning "FFmpeg download attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 5) { Start-Sleep -Seconds (10 * $attempt) }
            }
          }
          if (-not $downloaded) { throw "Could not download a valid FFmpeg ZIP after 5 attempts." }
          $ffmpegExtract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegExe = Get-ChildItem $ffmpegExtract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem $ffmpegExtract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) { throw "FFmpeg/FFprobe não encontrados no pacote baixado." }
          # Keep the complete FFmpeg bin payload, not only the two EXEs.
          # Some Windows builds require adjacent DLLs at runtime.
          Get-ChildItem -LiteralPath $ffmpegExe.DirectoryName -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $ffmpegDir -Force
          }
          if (-not (Test-Path (Join-Path $ffmpegDir "ffmpeg.exe")) -or
              -not (Test-Path (Join-Path $ffmpegDir "ffprobe.exe"))) {
            throw "FFmpeg/FFprobe were not copied into src-tauri/resources/ffmpeg."
          }
          Write-Host "Bundled FFmpeg payload:"
          Get-ChildItem -LiteralPath $ffmpegDir -File | Select-Object Name, Length | Format-Table

          # Check the actual filter entry and its libass description. Print diagnostics on failure.
          $ffmpegFilters = (& (Join-Path $ffmpegDir "ffmpeg.exe") -hide_banner -filters 2>&1 | Out-String)
          $ffmpegExitCode = $LASTEXITCODE
          $subtitleFilterLine = ($ffmpegFilters -split "`r?`n" | Where-Object { $_ -match '(?i)\bsubtitles\b' }) -join "`n"
          if ($ffmpegExitCode -ne 0 -or -not $subtitleFilterLine -or $subtitleFilterLine -notmatch '(?i)libass') {
            Write-Host "FFmpeg -filters output:"
            Write-Host $ffmpegFilters
            throw "FFmpeg não confirmou o filtro subtitles com libass (exit code: $ffmpegExitCode)."
          }
          Write-Host "Verified bundled FFmpeg subtitle filter:"
          Write-Host $subtitleFilterLine

          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git (Join-Path $env:RUNNER_TEMP "whisper.cpp")
          cmake -S (Join-Path $env:RUNNER_TEMP "whisper.cpp") -B (Join-Path $env:RUNNER_TEMP "whisper-build") -A x64 -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=OFF
          cmake --build (Join-Path $env:RUNNER_TEMP "whisper-build") --config Release --target whisper-cli
          $whisperExe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "whisper-build") -Filter whisper-cli.exe -Recurse | Select-Object -First 1
          if (-not $whisperExe) { throw "whisper-cli.exe não foi gerado." }
          Copy-Item $whisperExe.FullName (Join-Path $whisperDir "whisper-cli.exe") -Force
          Get-ChildItem (Join-Path $env:RUNNER_TEMP "whisper-build") -Filter *.dll -Recurse | ForEach-Object { Copy-Item $_.FullName $whisperDir -Force }

          Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin" -OutFile (Join-Path $whisperDir "ggml-tiny.bin")
          if ((Get-Item (Join-Path $whisperDir "ggml-tiny.bin")).Length -lt 1000000) { throw "Modelo Whisper baixado parece inválido." }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run project tests
        run: npm test

      - name: Run Rust backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the NSIS installer
        run: npm run tauri:build

      - name: Build standalone Edit Master installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $payload) { throw "Tauri NSIS payload was not generated." }
          $compiler = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $compiler)) { throw ".NET Framework C# compiler was not found: $compiler" }
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "installer-output"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $output = Join-Path $outputDir "Edit-Master-1.0-Beta-Oficial-Setup.exe"
          $icon = Join-Path $env:GITHUB_WORKSPACE "src-tauri/icons/icon-m.ico"
          $bootstrapper = Join-Path $env:GITHUB_WORKSPACE "installer/Bootstrapper.cs"
          Write-Host "Repository root: $env:GITHUB_WORKSPACE"
          Write-Host "Bootstrapper source: $bootstrapper"
          if (-not (Test-Path -LiteralPath $bootstrapper -PathType Leaf)) {
            Write-Host "Installer directory contents:"
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "installer") -Force | Format-Table FullName, Length
            throw "Bootstrapper.cs is missing at installer/Bootstrapper.cs."
          }
          # Build the resource switch as a normal PowerShell string first. This avoids
          # PowerShell/native-argument parsing passing the literal "$($payload.FullName)" to csc.exe.
          $resourceArgument = "/resource:{0},EditMasterPayload.exe" -f $payload.FullName
          $outputArgument = "/out:{0}" -f $output
          $iconArgument = "/win32icon:{0}" -f $icon
          Write-Host "Embedding NSIS payload: $($payload.FullName)"
          & $compiler /nologo /target:winexe /platform:x64 /optimize+ $outputArgument $iconArgument /reference:System.Windows.Forms.dll /reference:System.Drawing.dll $resourceArgument $bootstrapper
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile the branded installer bootstrapper." }
          if (-not (Test-Path $output)) { throw "Standalone installer output was not created." }
          Write-Host "Standalone installer: $output"
          Write-Host ("Standalone installer size: {0:N1} MB" -f ((Get-Item $output).Length / 1MB))

      - name: Validate packaged frontend and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $index = Join-Path $env:GITHUB_WORKSPACE "dist/index.html"
          if (-not (Test-Path $index)) { throw "Frontend build did not produce dist/index.html." }
          $html = Get-Content $index -Raw
          $assets = [regex]::Matches($html, '(?:src|href)="([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          Write-Host "=== Production frontend entry ==="
          Write-Host $html
          foreach ($asset in $assets) {
            if ($asset -match '^(https?:|data:|#)') { continue }
            $relative = $asset.TrimStart('./').Replace('/', [IO.Path]::DirectorySeparatorChar)
            $assetPath = Join-Path (Split-Path $index) $relative
            if (-not (Test-Path $assetPath)) { throw "Frontend asset referenced by index.html is missing: $asset -> $assetPath" }
            Write-Host "Verified frontend asset: $asset"
          }
          $installer = Join-Path $env:GITHUB_WORKSPACE "installer-output/Edit-Master-1.0-Beta-Oficial-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Standalone branded installer was not generated." }
          Write-Host "Installer: $installer"
          Write-Host "Installer size: $((Get-Item $installer).Length) bytes"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Edit-Master-1.0-Beta-Oficial-Windows-Setup
          path: installer-output/Edit-Master-1.0-Beta-Oficial-Setup.exe
          if-no-files-found: error
          retention-days: 30
